# Upstream repos Regteia ingests. The only place they are named. Never add them as git submodules.
# url: git URL or local path. ref: branch, tag or commit SHA (pin a SHA for reproducible builds).

[[upstream]]
name = "normas-bcb"
url = "https://github.com/BrunooMoniz/normas-bcb.git"
ref = "main"
adapter = "normas_grafo"
acervo = "bcb"

[[upstream]]
name = "normas-cvm"
url = "https://github.com/BrunooMoniz/normas-cvm.git"
ref = "main"
adapter = "normas_grafo"
acervo = "cvm"

# Federal acts (ADR 0005). Huge repo (~1.49M files): shallow, and only the acts the BCB/CVM norms point to are checked
# out. Must come after the normas repos: what to load is read from the graph they built.
[[upstream]]
name = "leis"
url = "https://github.com/ctresb/leis.git"
ref = "main"
adapter = "ctresb_leis"
acervo = "lei"
sparse = ["/README.md"]
shallow = true
