[project]
name = "regteia-schema"
version = "0.0.0"
description = "Regteia shared contract: Pydantic models, IDs and enums"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regteia_schema"]
