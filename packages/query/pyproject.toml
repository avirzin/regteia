[project]
name = "regteia-query"
version = "0.0.0"
description = "Regteia read logic: every query mcp, server and the CLI expose"
requires-python = ">=3.12"
dependencies = ["regteia-schema", "neo4j>=5.26", "pydantic>=2.9"]

[project.scripts]
regteia = "regteia_query.cli:main"

[tool.uv.sources]
regteia-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regteia_query"]
