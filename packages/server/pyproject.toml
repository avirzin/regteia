[project]
name = "regteia-server"
version = "0.0.0"
description = "Regteia local web server: JSON API, graph export (Arrow) and the built web app"
requires-python = ">=3.12"
dependencies = [
    "regteia-schema",
    "regteia-query",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyarrow>=18",
]

[project.scripts]
regteia-server = "regteia_server.cli:main"

[tool.uv.sources]
regteia-schema = { workspace = true }
regteia-query = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regteia_server"]
