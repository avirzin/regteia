[project]
name = "regteia-mcp"
version = "0.0.0"
description = "Regteia local MCP server (stdio, read-only): search, norms, articles and relations from the local graph"
requires-python = ">=3.12"
dependencies = [
    "regteia-schema",
    "regteia-query",
    "mcp>=2.3,<3",
]

[project.scripts]
regteia-mcp = "regteia_mcp.servidor:main"

[tool.uv.sources]
regteia-schema = { workspace = true }
regteia-query = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regteia_mcp"]
