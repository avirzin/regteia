[project]
name = "regteia-ingest"
version = "0.0.0"
description = "Regteia ingest: upstream adapters, parsers and the only Neo4j writer"
requires-python = ">=3.12"
dependencies = ["regteia-schema", "neo4j>=5.26"]

[project.scripts]
regteia-ingest = "regteia_ingest.cli:main"

[tool.uv.sources]
regteia-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regteia_ingest"]
