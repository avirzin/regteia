# CI only: GitHub cannot reach the local database. Hourly updates run in the `updater` compose service.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest   # integration tests start Neo4j with testcontainers (Docker is available on the runner)

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build   # tsc --noEmit + vite build
