[project]
name = "regteia"
version = "0.0.0"
description = "Brazilian financial regulation as a local graph"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "testcontainers[neo4j]>=4.8",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["_upstream"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs Docker (starts Neo4j with testcontainers)"]
